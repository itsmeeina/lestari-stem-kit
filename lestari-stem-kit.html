<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lestari STEM Kit — Modul Pembelajaran STEM Praktikal | JMSK PTSB</title>
<meta name="description" content="Lestari STEM Kit ialah siri modul pembelajaran STEM praktikal (kren hidraulik, kereta getah, trek guli, robot Pascal) dengan kalkulator interaktif, penilaian, dan kaitan SDG — dibangunkan oleh Unit Sains JMSK, Politeknik Tuanku Sultanah Bahiyah.">
<meta name="keywords" content="Lestari STEM Kit, STEM, JMSK, PTSB, Politeknik Tuanku Sultanah Bahiyah, kerja dan kuasa, tenaga kinetik, tenaga keupayaan, Prinsip Pascal, SDG, pembelajaran praktikal">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:url" content="https://itsmeeina.github.io/lestari-stem-kit/">
<meta property="og:title" content="Lestari STEM Kit — Modul Pembelajaran STEM Praktikal">
<meta property="og:description" content="Empat modul STEM hands-on lengkap dengan kalkulator interaktif, penilaian dan kaitan SDG. Dibangunkan oleh Unit Sains JMSK, Politeknik Tuanku Sultanah Bahiyah.">
<meta property="og:locale" content="ms_MY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132038;
    --navy-2:#1C3054;
    --navy-line: rgba(255,255,255,0.13);
    --paper:#F6F6F0;
    --paper-line: rgba(19,32,56,0.07);
    --ink:#152134;
    --ink-soft:#57626F;
    --card:#FFFFFF;
    --line:#E1E0D3;

    --coral:#FF6B4A;
    --coral-deep:#DE4B2C;
    --coral-soft:#FFE6DF;

    --teal:#0FA99A;
    --teal-deep:#0A7E73;
    --teal-soft:#DEF4F1;

    --amber:#F2A93B;
    --amber-deep:#C3801C;
    --amber-soft:#FCEDD2;

    --violet:#8B7CF6;
    --violet-deep:#5B3FD9;
    --violet-soft:#EBE7FE;

    --wrong:#D6473F;
    --wrong-bg:#FBEAE9;
    --right:#0FA99A;
    --right-bg:#DEF4F1;

    --radius:6px;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; color:var(--ink); letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  section{scroll-margin-top:82px;}
  ul{margin:0; padding:0;}
  li{list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  input, textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--teal-deep); outline-offset:2px;}

  /* ---------- NAV ---------- */
  #topnav{position:sticky; top:0; z-index:200; background:var(--navy); border-bottom:1px solid var(--navy-line);}
  #topnav::after{content:""; display:block; height:3px; background:linear-gradient(90deg, var(--coral), var(--teal), var(--amber), var(--violet));}
  #topnav .wrap{display:flex; align-items:center; justify-content:space-between; height:64px; gap:18px;}
  .brand{display:flex; align-items:center; gap:10px; color:#F7F7F2; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; white-space:nowrap;}
  .brand .mark{width:20px;height:20px; flex:none;}
  .navmenu{display:flex; align-items:center; gap:24px; flex:1; justify-content:flex-end;}
  #topnav nav{display:flex; align-items:center; gap:22px;}
  #topnav nav a{
    color:rgba(247,247,242,0.72); text-decoration:none; font-size:14px; font-weight:500;
    padding:4px 1px; border-bottom:2px solid transparent; white-space:nowrap;
  }
  #topnav nav a:hover, #topnav nav a.active{color:#fff; border-bottom-color:var(--coral);}
  .langtoggle{display:flex; border:1px solid rgba(255,255,255,0.25); border-radius:999px; padding:3px; gap:2px; flex:none;}
  .langtoggle button{
    background:none; border:none; color:rgba(247,247,242,0.65); font-size:12.5px; font-weight:700;
    padding:6px 12px; border-radius:999px; font-family:'JetBrains Mono',monospace;
  }
  .langtoggle button.active{background:var(--coral); color:#211004;}
  .tiktok-btn{
    display:flex; align-items:center; gap:8px; background:var(--coral); color:#2A0E03; text-decoration:none;
    padding:8px 15px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap; border:none;
  }
  .tiktok-btn:hover{background:#FF7F60;}
  #navtoggle{display:none; background:none; border:1px solid rgba(255,255,255,0.3); color:#fff; padding:7px 11px; border-radius:4px; font-size:16px;}

  /* ---------- HERO ---------- */
  #utama{background:linear-gradient(150deg,var(--navy) 0%, var(--navy-2) 100%); color:#F7F7F2; padding:78px 0 60px; position:relative; overflow:hidden;}
  #utama .blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:0.28; z-index:0;}
  #utama .blob1{width:340px; height:340px; background:var(--coral); top:-120px; right:-60px;}
  #utama .blob2{width:280px; height:280px; background:var(--teal); bottom:-140px; left:10%;}
  #utama .blob3{width:260px; height:260px; background:var(--violet); top:40%; right:22%;}
  #utama::before{
    content:""; position:absolute; inset:0; z-index:0;
    background-image:linear-gradient(var(--navy-line) 1px, transparent 1px), linear-gradient(90deg, var(--navy-line) 1px, transparent 1px);
    background-size:36px 36px;
    -webkit-mask-image:linear-gradient(to bottom, black, transparent 90%);
            mask-image:linear-gradient(to bottom, black, transparent 90%);
  }
  .hero-inner{position:relative; z-index:1; display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center;}
  .hero-tag{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--coral); margin-bottom:14px;}
  .hero-inner h1{font-size:clamp(36px,5vw,56px); line-height:1.05; font-weight:700; color:#fff; max-width:11ch;}
  .hero-inner p.lead{margin-top:16px; font-size:16.5px; color:rgba(247,247,242,0.82); max-width:48ch;}
  .hero-stats{display:flex; gap:0; margin-top:30px; border-top:1px solid var(--navy-line);}
  .hero-stats div{padding:16px 22px 0 0; margin-right:22px; border-right:1px solid var(--navy-line);}
  .hero-stats div:last-child{border-right:none;}
  .hero-stats strong{display:block; font-family:'Space Grotesk',sans-serif; font-size:24px; color:#fff;}
  .hero-stats span{font-size:12px; color:rgba(247,247,242,0.6);}
  .hero-cta{margin-top:28px; display:flex; gap:12px; flex-wrap:wrap;}
  .btn-primary{background:var(--coral); color:#2A0E03; text-decoration:none; font-weight:700; font-size:14.5px; padding:12px 22px; border-radius:999px; border:none; display:inline-block;}
  .btn-primary:hover{background:#FF7F60;}
  .btn-ghost{background:transparent; color:#fff; text-decoration:none; font-weight:600; font-size:14.5px; padding:12px 22px; border-radius:999px; border:1px solid rgba(255,255,255,0.35); display:inline-block;}
  .btn-ghost:hover{border-color:#fff;}
  .hero-diagram{position:relative; z-index:1;}
  .hero-diagram svg{width:100%; height:auto;}

  /* ---------- SECTION HEADER ---------- */
  .sec-head{max-width:58ch; margin-bottom:36px;}
  .sec-head .kicker{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--coral-deep); margin-bottom:8px;}
  .sec-head h2{font-size:clamp(25px,3.2vw,33px);}
  .sec-head p{margin-top:12px; color:var(--ink-soft); font-size:15.5px;}

  /* ---------- TENTANG ---------- */
  #tentang{padding:68px 0; border-bottom:1px solid var(--line); background:
      linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
      background-size:36px 36px;}
  .tentang-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:46px; align-items:start;}
  #tentang p.body{color:var(--ink-soft); font-size:15.5px; margin:0 0 14px;}
  .credit-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px;}
  .credit-box h4{font-size:14px; margin-bottom:12px;}
  .credit-box li{font-size:14px; color:var(--ink-soft); padding:7px 0; border-top:1px solid var(--line);}
  .credit-box li:first-of-type{border-top:none;}
  .credit-box .label{display:block; font-size:11.5px; color:var(--coral-deep); font-family:'JetBrains Mono',monospace; margin-bottom:2px;}

  /* ---------- MODULES ---------- */
  #modul{padding:68px 0; border-bottom:1px solid var(--line);}
  .mod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px;}
  .mod-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    border-top:3px solid var(--accent, var(--coral));
  }
  .mod-card:hover{transform:translateY(-5px); box-shadow:0 14px 30px rgba(19,32,56,0.10); border-color:var(--line);}
  .mod-top{padding:22px 22px 18px; border-bottom:1px dashed var(--line);}
  .mod-icon{width:42px; height:42px; margin-bottom:14px;}
  .mod-tagline{font-size:12px; color:var(--ink-soft); margin-bottom:2px;}
  .mod-top h3{font-size:19px; margin-bottom:8px;}
  .mod-spec{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent-deep,var(--coral-deep)); background:var(--accent-soft,var(--coral-soft)); padding:3px 9px; border-radius:3px;}
  .mod-body{padding:18px 22px 22px; flex:1; display:flex; flex-direction:column; gap:16px;}
  .mod-body h5{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}
  .mod-body .objectives li{font-size:13.8px; color:var(--ink); padding-left:16px; position:relative; margin-bottom:6px;}
  .mod-body .objectives li::before{content:"•"; position:absolute; left:0; color:var(--accent-deep,var(--coral-deep)); font-weight:700;}
  details.mat{border-top:1px solid var(--line); padding-top:12px;}
  details.mat summary{cursor:pointer; font-size:13.5px; font-weight:600; color:var(--navy-2); list-style:none; display:flex; align-items:center; justify-content:space-between;}
  details.mat summary::-webkit-details-marker{display:none;}
  details.mat summary::after{content:"+"; font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--ink-soft);}
  details.mat[open] summary::after{content:"–";}
  details.mat .matlist{margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:4px 14px;}
  details.mat .matlist li{font-size:13px; color:var(--ink-soft);}
  .formula-box{margin-top:auto; background:var(--paper); border:1px solid var(--line); border-radius:3px; padding:12px 14px;}
  .formula-box .flabel{font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
  .formula-box ol{margin:0; padding-left:20px;}
  .formula-box li{
    font-family:'JetBrains Mono',monospace; font-size:14.5px; color:var(--accent-deep,var(--coral-deep));
    font-weight:700; list-style:decimal; padding:3px 0;
  }
  .mod-intro{font-size:13.8px; color:var(--ink-soft); line-height:1.55; margin:0;}
  .sdg-intro{
    background:var(--violet-soft); border:1px solid var(--violet); border-radius:4px;
    padding:14px 18px; font-size:13px; color:var(--ink); line-height:1.6; margin-bottom:26px;
  }
  .sdg-intro strong{color:var(--violet-deep);}
  .sdg-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;}
  .sdg-badge{
    width:30px; height:30px; border-radius:5px; color:#fff; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
  }
  details.sdg summary{cursor:pointer; font-size:13.5px; font-weight:600; color:var(--navy-2); list-style:none; display:flex; align-items:center; justify-content:space-between;}
  details.sdg summary::-webkit-details-marker{display:none;}
  details.sdg summary::after{content:"+"; font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--ink-soft);}
  details.sdg[open] summary::after{content:"–";}
  details.sdg .sdg-list{margin-top:10px; display:flex; flex-direction:column; gap:10px;}
  details.sdg .sdg-item{display:flex; gap:10px; align-items:flex-start;}
  details.sdg .sdg-item .sdg-badge{margin-top:1px;}
  details.sdg .sdg-item div{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  details.sdg .sdg-item strong{display:block; color:var(--ink); font-size:12.8px; margin-bottom:1px;}

  /* ---------- PROSES (timeline) ---------- */
  #proses{padding:68px 0; border-bottom:1px solid var(--line); background:var(--card);}
  .timeline{position:relative; margin-top:10px;}
  .timeline::before{content:""; position:absolute; left:19px; top:6px; bottom:6px; width:1px; background:var(--line);}
  .tstep{display:grid; grid-template-columns:40px 1fr; gap:0; padding-bottom:32px; position:relative;}
  .tstep:last-child{padding-bottom:0;}
  .tnum{width:40px; height:40px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; z-index:1;}
  .tcontent{padding-left:22px; padding-top:6px;}
  .tcontent h4{font-size:16.5px; margin-bottom:6px;}
  .tcontent p{font-size:14px; color:var(--ink-soft); margin:0; max-width:62ch;}

  /* ---------- GALERI ---------- */
  #galeri{padding:68px 0; border-bottom:1px solid var(--line); background:
      linear-gradient(var(--paper-line) 1px, transparent 1px), linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
      background-size:36px 36px;}
  .gal-grid{display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:150px; gap:16px;}
  .gcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .gphoto{
    background:linear-gradient(135deg,var(--navy-2),var(--navy)); position:relative; height:100%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;
  }
  .gphoto img{width:100%; height:100%; object-fit:cover;}
  .gphoto .placeholder{display:flex; flex-direction:column; align-items:center; gap:8px; color:rgba(247,247,242,0.72); padding:18px; text-align:center;}
  .gphoto .placeholder svg{width:30px; height:30px; opacity:0.85;}
  .gphoto .placeholder span{font-size:12px; font-weight:600; max-width:20ch;}
  .gphoto input[type=file]{display:none;}
  .gcard.addcard .gphoto{background:var(--paper); border:1.5px dashed var(--line);}
  .gcard.addcard .placeholder{color:var(--ink-soft);}
  .gcard.addcard .placeholder svg{opacity:0.5;}
  @media (min-width:861px){
    .gcard:nth-child(1){grid-column:span 2; grid-row:span 2;}
    .gcard:nth-child(2){grid-row:span 2;}
  }

  /* ---------- KALKULATOR ---------- */
  #kalkulator{padding:68px 0; border-bottom:1px solid var(--line);}
  .tab-row{display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap;}
  .tab-btn{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .panel{display:none;}
  .panel.active{display:block;}
  .calc-box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); display:grid; grid-template-columns:1fr 1fr;}
  .calc-inputs{padding:28px; border-right:1px solid var(--line);}
  .calc-inputs h4{font-size:16px; margin-bottom:4px;}
  .calc-inputs .sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;}
  .field label .unit{font-family:'JetBrains Mono',monospace; color:var(--coral-deep);}
  .field input[type=number]{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:14.5px; background:var(--paper); color:var(--ink);}
  .calc-outputs{padding:28px; display:flex; flex-direction:column; gap:14px;}
  .out-row{background:var(--paper); border:1px solid var(--line); border-radius:3px; padding:14px 16px; display:flex; align-items:baseline; justify-content:space-between;}
  .out-row .oname{font-size:13px; color:var(--ink-soft);}
  .out-row .oval{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; color:var(--teal-deep);}
  .out-formula{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .mini-table{width:100%; border-collapse:collapse; margin-top:4px;}
  .mini-table th{font-size:11.5px; color:var(--ink-soft); text-align:left; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line);}
  .mini-table td{padding:6px 8px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .mini-table input{width:82px; padding:6px 8px; border:1px solid var(--line); border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:13px; background:var(--paper);}
  .mini-table td.res{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--teal-deep);}
  .steps-toggle{
    margin-top:16px; background:none; border:1px dashed var(--line); color:var(--teal-deep);
    font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:4px; width:100%; text-align:left;
    display:flex; align-items:center; justify-content:space-between;
  }
  .steps-toggle:hover{border-color:var(--teal-deep);}
  .steps-toggle:disabled{color:var(--ink-soft); cursor:not-allowed; opacity:0.6;}
  .steps-toggle:disabled:hover{border-color:var(--line);}
  .steps-box{display:none; margin-top:10px; background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:14px 16px;}
  .steps-box.open{display:block;}
  .steps-box .steps-empty{margin:0; font-size:12.5px; color:var(--ink-soft); font-style:italic;}
  .steps-box ol{margin:0; padding-left:18px;}
  .steps-box li{list-style:decimal; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink); padding:5px 0; line-height:1.5;}
  .insight-box{
    display:none; margin-top:16px; background:var(--teal-soft); border:1px solid var(--teal); border-radius:4px;
    padding:14px 16px; font-size:13px; color:var(--ink); line-height:1.6;
  }
  .insight-box.show{display:block;}
  .insight-box .ilabel{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--teal-deep); font-weight:700; margin-bottom:6px;}

  /* ---------- PENILAIAN ---------- */
  #penilaian{padding:68px 0 84px; background:var(--card); border-bottom:1px solid var(--line);}
  .qcard{border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:14px; background:var(--paper);}
  .qcard .qtext{font-size:15px; font-weight:600; margin-bottom:14px;}
  .qopt{display:flex; align-items:flex-start; gap:10px; padding:9px 10px; border-radius:3px; font-size:14px; margin-bottom:4px; cursor:pointer; border:1px solid transparent;}
  .qopt:hover{background:rgba(19,32,56,0.05);}
  .qopt input{margin-top:3px;}
  .qcard.answered .qopt.answer-right{background:var(--right-bg); border-color:var(--right); color:var(--right-deep,#0A7E73);}
  .qcard.answered .qopt.answer-wrong{background:var(--wrong-bg); border-color:var(--wrong); color:var(--wrong);}
  .qexplain{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); font-size:13.5px; color:var(--ink-soft);}
  .qexplain .lbl{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--teal-deep); margin-bottom:4px; display:block;}
  .qcard.answered .qexplain{display:block;}
  .qcard.answered .qopt{pointer-events:none;}
  .quiz-actions{display:flex; align-items:center; gap:16px; margin-top:26px; flex-wrap:wrap;}
  .quiz-score{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--teal-deep);}
  .quiz-msg{font-size:13.5px; color:var(--ink-soft);}
  .btn-reset{background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600;}
  .btn-reset:hover{border-color:var(--ink-soft); color:var(--ink);}
  .quiz-module-label{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}

  /* ---------- FOOTER ---------- */
  footer{background:var(--navy); color:rgba(247,247,242,0.75); padding:44px 0 26px;}
  .foot-grid{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:24px;}
  footer .brand{margin-bottom:10px;}
  footer .foot-note{font-size:13px; max-width:44ch; color:rgba(247,247,242,0.55);}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function goToSection(id){
  const target = document.getElementById(id);
  if(!target) return;
  const navH = document.getElementById('topnav').offsetHeight;
  const top = target.getBoundingClientRect().top + window.pageYOffset - navH + 1;
  window.scrollTo({top, behavior:'smooth'});
  document.getElementById('topnav').classList.remove('open');
}

function renderNav(){
  const t = UI[lang];
  const nav = document.getElementById('navlinks');
  nav.innerHTML = '';
  t.nav.forEach(([id,label])=>{
    const a = document.createElement('a');
    a.href = 'javascript:void(0)'; a.textContent = label; a.dataset.section = id;
    a.addEventListener('click', (e)=>{ e.preventDefault(); goToSection(id); });
    nav.appendChild(a);
  });
  document.getElementById('langMS').classList.toggle('active', lang==='ms');
  document.getElementById('langEN').classList.toggle('active', lang==='en');
  document.documentElement.lang = lang;
}

  document.getElementById('heroCta2').textContent = h.cta2;
  const statsWrap = document.getElementById('heroStats');
  statsWrap.innerHTML = '';
  h.stats.forEach(([val,label])=>{
    const d = el('div','', '<strong data-target="'+val+'">0</strong><span></span>');
    d.querySelector('span').textContent = label;
    statsWrap.appendChild(d);
  });
  animateStats();

function animateStats(){
  document.querySelectorAll('#heroStats strong').forEach(strong=>{
    const raw = strong.dataset.target;
    const target = parseInt(raw.replace(/\D/g,'')) || 0;
    const suffix = raw.replace(/[0-9]/g,'');
    let cur = 0;
    const step = Math.max(1, Math.ceil(target/24));
    const timer = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(timer); }
      strong.textContent = cur + suffix;
    }, 30);
  });
}

function renderGalleryGrid(){
  const g = UI[lang].galeri;
  const grid = document.getElementById('galGrid');
  grid.innerHTML = '';
  galleryState.forEach((item, idx) => grid.appendChild(buildGalleryCard(item, idx)));

  const addCard = el('div','gcard addcard');
  const inputId = 'galAddInput';
  addCard.innerHTML = `
    <label class="gphoto" for="${inputId}">
      <div class="placeholder">${PLUS_SVG}<span>${g.addLabel}</span></div>
      <input type="file" id="${inputId}" accept="image/*">
    </label>`;
  addCard.querySelector('input').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      galleryState.push({src:ev.target.result});
      renderGalleryGrid();
    };
    reader.readAsDataURL(file);
  });
  grid.appendChild(addCard);
}

function buildGalleryCard(item, realIndex){
  const g = UI[lang].galeri;
  const card = el('div','gcard');
  const inputId = 'galInput'+realIndex;
  const photoInner = item.src
    ? `<img src="${item.src}" alt="">`
    : `<div class="placeholder">${CAMERA_SVG}<span>${g.uploadLabel}</span></div>`;
  card.innerHTML = `
    <label class="gphoto" for="${inputId}">
      ${photoInner}
      <input type="file" id="${inputId}" accept="image/*">
    </label>`;
  card.querySelector('input').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      galleryState[realIndex].src = ev.target.result;
      renderGalleryGrid();
    };
    reader.readAsDataURL(file);
  });
  return card;
}

function renderCalcLabels(){

  document.getElementById('calcTitle').textContent = c.title;
  document.getElementById('calcDesc').textContent = c.desc;

  tabs.innerHTML = ''; panelsWrap.innerHTML = '';

  MODULES.forEach((mod,i)=>{
    const b = el('button','tab-btn'+(i===0?' active':''), mod.name);
    b.dataset.tab = mod.id;
    b.addEventListener('click', ()=>{
      document.querySelectorAll('#calcTabs .tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('#calcPanels .panel').forEach(p=>p.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('calcpanel-'+mod.id).classList.add('active');
    });
    tabs.appendChild(b);

    const panel = el('div','panel'+(i===0?' active':''));
    panel.id = 'calcpanel-'+mod.id;
    panel.appendChild(mod.calc.type === 'table' ? buildTablePanel(mod, c) : buildSimplePanel(mod, c));
    panelsWrap.appendChild(panel);
  });
}

function fmtOut(val, decimals, unit){ return val.toFixed(decimals) + ' ' + unit; }

function buildSimplePanel(mod, c){
  const cfg = mod.calc;
  const box = el('div','calc-box');
  const inputsHtml = cfg.fields.map(f=>`
    <div class="field">
      <label>${f.label[lang]} <span class="unit">(${f.unit})</span></label>
      <input type="number" id="c-${mod.id}-${f.id}" value="${f.value}" step="${f.step}" min="0">
    </div>`).join('');
  const outputsHtml = cfg.outputs.map(o=>`
    <div class="out-row"><span class="oname">${o.label[lang]}</span><span class="oval" id="o-${mod.id}-${o.key}">—</span></div>`).join('');
  box.innerHTML = `
    <div class="calc-inputs">
      <h4>${mod.name} — ${mod.tagline[lang]}</h4>
      <div class="sub">${cfg.sub[lang]}</div>
      ${inputsHtml}
      <button type="button" class="btn-primary calc-go" style="border:none; width:100%; margin-top:6px;">${UI[lang].calc.calcBtn}</button>
    </div>
    <div class="calc-outputs">
      ${outputsHtml}
      <div class="out-formula">${cfg.note[lang]}</div>
      <div class="insight-box" id="insight-${mod.id}"><span class="ilabel">${UI[lang].calc.insightLabel}</span><span class="itext"></span></div>
      <button type="button" class="steps-toggle" data-mod="${mod.id}" disabled>${UI[lang].calc.stepsLabel}<span>+</span></button>
      <div class="steps-box" id="steps-${mod.id}"><p class="steps-empty">${UI[lang].calc.stepsEmpty}</p><ol></ol></div>
    </div>`;

  function recompute(){
    const v = {};
    cfg.fields.forEach(f=>{ v[f.id] = parseFloat(document.getElementById(`c-${mod.id}-${f.id}`).value) || 0; });
    const r = cfg.compute(v);
    cfg.outputs.forEach(o=>{ document.getElementById(`o-${mod.id}-${o.key}`).textContent = fmtOut(r[o.key], o.decimals, o.unit); });
    const insightBox = box.querySelector(`#insight-${mod.id}`);
    insightBox.querySelector('.itext').innerHTML = cfg.insight(v,r)[lang];
    insightBox.classList.add('show');
    const stepsBox = box.querySelector(`#steps-${mod.id}`);
    stepsBox.querySelector('.steps-empty').style.display = 'none';
    stepsBox.querySelector('ol').innerHTML = cfg.steps(v,r)[lang].map(s=>'<li>'+s+'</li>').join('');
    stepsBox.classList.remove('open');
    const toggleBtn = box.querySelector('.steps-toggle');
    toggleBtn.disabled = false;
    toggleBtn.firstChild.textContent = UI[lang].calc.stepsLabel;
  }
  box.querySelector('.calc-go').addEventListener('click', recompute);
  const toggleBtn = box.querySelector('.steps-toggle');
  toggleBtn.addEventListener('click', ()=>{
    const stepsBox = box.querySelector(`#steps-${mod.id}`);
    const open = stepsBox.classList.toggle('open');
    toggleBtn.firstChild.textContent = open ? UI[lang].calc.stepsHide : UI[lang].calc.stepsLabel;
  });
  return box;
}

function buildTablePanel(mod, c){
  const cfg = mod.calc;
  const box = el('div','calc-box');
  const rowsHtml = cfg.rows.map(r=>`
    <tr><td>${r.id}</td><td><input type="number" id="c-${mod.id}-${r.id}" value="${r.value}" step="0.01" min="0"></td><td class="res" id="o-${mod.id}-${r.id}">—</td></tr>`).join('');
  box.innerHTML = `
    <div class="calc-inputs">
      <h4>${mod.name} — ${mod.tagline[lang]}</h4>
      <div class="sub">${cfg.sub[lang]}</div>
      <div class="field">
        <label>${cfg.massField.label[lang]} <span class="unit">(${cfg.massField.unit})</span></label>
        <input type="number" id="c-${mod.id}-${cfg.massField.id}" value="${cfg.massField.value}" step="${cfg.massField.step}" min="0">
      </div>
      <button type="button" class="btn-primary calc-go" style="border:none; width:100%; margin-top:6px;">${UI[lang].calc.calcBtn}</button>
    </div>
    <div class="calc-outputs">
      <table class="mini-table">
        <thead><tr><th>${cfg.colLabels.pos[lang]}</th><th>${cfg.colLabels.height[lang]}</th><th>${cfg.colLabels.result[lang]}</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="out-formula">${cfg.note[lang]}</div>
      <div class="insight-box" id="insight-${mod.id}"><span class="ilabel">${UI[lang].calc.insightLabel}</span><span class="itext"></span></div>
      <button type="button" class="steps-toggle" data-mod="${mod.id}" disabled>${UI[lang].calc.stepsLabel}<span>+</span></button>
      <div class="steps-box" id="steps-${mod.id}"><p class="steps-empty">${UI[lang].calc.stepsEmpty}</p><ol></ol></div>
    </div>`;

  function recompute(){
    const mass = parseFloat(document.getElementById(`c-${mod.id}-${cfg.massField.id}`).value) || 0;
    const rowVals = cfg.rows.map(r => parseFloat(document.getElementById(`c-${mod.id}-${r.id}`).value) || 0);
    const results = rowVals.map(h => cfg.compute(mass, h));
    cfg.rows.forEach((r,i)=>{ document.getElementById(`o-${mod.id}-${r.id}`).textContent = results[i].toFixed(4); });
    const insightBox = box.querySelector(`#insight-${mod.id}`);
    insightBox.querySelector('.itext').innerHTML = cfg.insight(mass, rowVals, results)[lang];
    insightBox.classList.add('show');
    const stepsBox = box.querySelector(`#steps-${mod.id}`);
    stepsBox.querySelector('.steps-empty').style.display = 'none';
    stepsBox.querySelector('ol').innerHTML = cfg.steps(mass, rowVals, results)[lang].map(s=>'<li>'+s+'</li>').join('');
    stepsBox.classList.remove('open');
    const toggleBtn = box.querySelector('.steps-toggle');
    toggleBtn.disabled = false;
    toggleBtn.firstChild.textContent = UI[lang].calc.stepsLabel;
  }
  box.querySelector('.calc-go').addEventListener('click', recompute);
  const toggleBtn = box.querySelector('.steps-toggle');
  toggleBtn.addEventListener('click', ()=>{
    const stepsBox = box.querySelector(`#steps-${mod.id}`);
    const open = stepsBox.classList.toggle('open');
    toggleBtn.firstChild.textContent = open ? UI[lang].calc.stepsHide : UI[lang].calc.stepsLabel;
  });
  return box;
}

    });
    tabs.appendChild(tabBtn);

    const panel = el('div','panel'+(mi===0?' active':''));
    panel.id = 'qpanel-'+mod.id;
    const modLabel = el('div','quiz-module-label', mod.name + ' — ' + mod.tagline[lang]);
    panel.appendChild(modLabel);

    const cardsWrap = el('div');
    QUIZ[mod.id].forEach((item, qi)=>{
      const data = item[lang];
      const card = el('div','qcard');
      card.dataset.qid = mod.id+'-'+qi;
      const qtext = el('div','qtext', (qi+1)+'. '+data.q);
      card.appendChild(qtext);
      data.opts.forEach((opt, oi)=>{
        const label = el('label','qopt');
        label.dataset.opt = oi;
        label.innerHTML = '<input type="radio" name="'+mod.id+'-q'+qi+'" value="'+oi+'"> <span></span>';
        label.querySelector('span').textContent = opt;
        card.appendChild(label);
      });
      const explain = el('div','qexplain', '<span class="lbl"></span>');
      explain.querySelector('.lbl').textContent = (lang==='ms' ? 'Penjelasan' : 'Explanation');
      explain.appendChild(document.createTextNode(data.explain));
      card.appendChild(explain);
      cardsWrap.appendChild(card);
    });
    panel.appendChild(cardsWrap);

    const actions = el('div','quiz-actions');
    const checkBtn = el('button','btn-primary', q.check);
    checkBtn.style.border = 'none';
    const resetBtn = el('button','btn-reset', q.reset);
    const scoreSpan = el('span','quiz-score');
    const msgSpan = el('span','quiz-msg');
    actions.appendChild(checkBtn); actions.appendChild(resetBtn); actions.appendChild(scoreSpan); actions.appendChild(msgSpan);
    panel.appendChild(actions);

    checkBtn.addEventListener('click', ()=>{
      let score = 0;
      const items = QUIZ[mod.id];
      items.forEach((item, qi)=>{
        const card = panel.querySelector('.qcard[data-qid="'+mod.id+'-'+qi+'"]');
        const selected = card.querySelector('input[name="'+mod.id+'-q'+qi+'"]:checked');
        card.classList.add('answered');
        card.querySelectorAll('.qopt').forEach(o=>o.classList.remove('answer-right','answer-wrong'));
        const rightOpt = card.querySelector('.qopt[data-opt="'+item.correct+'"]');
        if(rightOpt) rightOpt.classList.add('answer-right');
        if(selected){
          const chosen = parseInt(selected.value);
          if(chosen === item.correct){ score++; }
          else{
            const wrongOpt = card.querySelector('.qopt[data-opt="'+chosen+'"]');
            if(wrongOpt) wrongOpt.classList.add('answer-wrong');
          }
        }
      });
      const total = items.length;
      scoreSpan.textContent = q.scorePrefix + ' ' + score + ' / ' + total;
      const pct = score/total;
      msgSpan.textContent = pct >= 0.75 ? q.msgHigh : (pct >= 0.5 ? q.msgMid : q.msgLow);
    });

    resetBtn.addEventListener('click', ()=>{
      panel.querySelectorAll('.qcard').forEach(card=>{
        card.classList.remove('answered');
        card.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
        card.querySelectorAll('.qopt').forEach(o=>o.classList.remove('answer-right','answer-wrong'));
      });
      scoreSpan.textContent = ''; msgSpan.textContent = '';
    });

    panels.appendChild(panel);
  });
}

function renderFooter(){
  const f = UI[lang].footer;
  document.getElementById('footNote').textContent = f.note;
  document.getElementById('footTiktokLabel').textContent = f.tiktok;
  document.getElementById('footCopy').textContent = f.copy;
}

function renderAll(){
  renderNav(); renderHero(); renderAbout(); renderModules(); renderTimeline();
  renderGallery(); renderCalcLabels(); renderQuiz(); renderFooter();
}

/* ===================== INTERACTIONS ===================== */
document.getElementById('langMS').addEventListener('click', ()=>{ lang='ms'; renderAll(); });
document.getElementById('langEN').addEventListener('click', ()=>{ lang='en'; renderAll(); });

document.getElementById('navtoggle').addEventListener('click', ()=>{
  document.getElementById('topnav').classList.toggle('open');
});

document.getElementById('heroCta1').addEventListener('click', ()=> goToSection('modul'));
document.getElementById('heroCta2').addEventListener('click', ()=> goToSection('kalkulator'));

const TIKTOK_URL = "https://www.tiktok.com/@pshjmskptsb";
document.getElementById('tiktokNavBtn').href = TIKTOK_URL;
document.getElementById('tiktokFootBtn').href = TIKTOK_URL;

// Scroll-spy nav highlight
const sectionIds = ['tentang','modul','proses','galeri','kalkulator','penilaian'];
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      document.querySelectorAll('#navlinks a').forEach(a=>{
        a.classList.toggle('active', a.dataset.section === entry.target.id);
      });
    }
  });
}, {rootMargin:'-40% 0px -55% 0px'});
window.addEventListener('load', ()=>{
  sectionIds.forEach(id=>{ const s = document.getElementById(id); if(s) observer.observe(s); });
});

renderAll();
</script>
